import java.util.Properties

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystorePropsFile = rootProject.file("keystore.properties")
if (!keystorePropsFile.exists()) {
    throw new GradleException("Release signing requires android/keystore.properties")
}
def keystoreProps = new Properties()
keystorePropsFile.withInputStream { keystoreProps.load(it) }
def requiredKeystoreProps = ["keyAlias", "keyPassword", "storeFile", "storePassword"]
def missingKeystoreProps = requiredKeystoreProps.findAll {
    !keystoreProps.getProperty(it)?.trim()
}
if (!missingKeystoreProps.empty) {
    throw new GradleException(
        "Release signing properties are missing: ${missingKeystoreProps.join(', ')}"
    )
}
def releaseKeystoreFile = file(keystoreProps.getProperty("storeFile"))
if (!releaseKeystoreFile.isFile()) {
    throw new GradleException("Release keystore file does not exist")
}

android {
    namespace "com.atherpulse.solasflow"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId "com.atherpulse.solasflow"
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProps['keyAlias']
            keyPassword keystoreProps['keyPassword']
            storeFile releaseKeystoreFile
            storePassword keystoreProps['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}